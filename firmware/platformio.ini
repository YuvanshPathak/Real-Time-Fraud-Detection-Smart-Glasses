; PlatformIO Project Configuration File — XIAO ESP32-S3 Sense, voice module only.
;
; Uses the pioarduino fork of platform-espressif32, not the official PlatformIO
; registry: the official espressif32 platform is stuck on ESP-IDF 4.4, which is
; too old for the mic driver's driver/i2s_pdm.h (needs ESP-IDF 5.x). Confirmed
; during last firmware phase — do not switch back without re-checking this.
;
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; qio_opi = the PSRAM mode equivalent to Arduino IDE's "Tools > PSRAM > OPI PSRAM".
; Without this, psramFound() reports false despite the hardware having 8MB PSRAM,
; and large buffer allocations (WAV + multipart body) silently fall back to
; internal SRAM (~270KB) and fail. Confirmed root cause last phase.
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    ; ESP32-S3 native USB CDC: without this, early boot Serial output can be
    ; lost to USB re-enumeration on reset (observed last phase).
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; esp-tflite-micro: Espressif's actively-maintained TFLite Micro port (the
; older Arduino_TensorFlowLite library is unmaintained). arduinoFFT: FFT for
; the TinyML on-device feature extraction, pinned to the 1.6.x line for its
; classic Compute()/ComplexToMagnitude() API — see the comment in
; firmware/src/tinyml_features.cpp. Neither has been test-compiled against
; this project in this environment (no PlatformIO toolchain available here) —
; the first `pio run` after pulling this is the real test; see ml/README.md
; and CLAUDE.md for the TinyML feature's proof-of-concept status.
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
    espressif/esp-tflite-micro @ ^1.3.0
    kosme/arduinoFFT @ ^1.6.2
